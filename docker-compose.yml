version: '3.9'
services:
  api:
    build: ./apps/api
    ports: ["3001:3001"]
    volumes:
      - ./apps/api/uploads:/app/uploads
    environment:
      DATABASE_URL: file:./dev.db
      JWT_ACCESS_SECRET: change-in-production
      JWT_REFRESH_SECRET: change-in-production
      NODE_ENV: development
  web:
    build: ./apps/web
    ports: ["5173:5173"]
    depends_on: [api]
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
